// Doc #EXTM3U: moi cap "#EXTINF:-1,Ten kenh" + dong link ke sau thanh 1 kenh.
// Dong link khong co EXTINF thi lay chinh link lam ten.
function parseM3U(text) {
  var lines = text.replace(/^\uFEFF/, "").split(/\r?\n/);
  var list = [], title = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) { continue; }
    if (line.indexOf("#EXTINF:") === 0) {
      var comma = line.indexOf(",");
      title = comma >= 0 ? line.slice(comma + 1).trim() : "";
      continue;
    }
    if (line.charAt(0) === "#") { continue; }
    list.push({metaData: {artist: "", title: title || line}, url: line});
    title = null;
  }
  return list;
}
// Tai radio.m3u cung thu muc (no-cache de sua file la trang nap lai ngay);
// loi hoac file rong thi dung TRACKS du phong.
function loadTracks() {
  return fetch("radio.m3u", {cache: "no-cache"}).then(function(res){
    if (!res.ok) { throw new Error("HTTP " + res.status); }
    return res.text();
  }).then(function(text){
    var list = parseM3U(text);
    return list.length > 0 ? list : TRACKS;
  }).catch(function(){ return TRACKS; });
}
function startWebamp(tracks) {
var webamp = new Webamp({
    initialSkin: {url: "Winamp5_Classified_v5.5_0_3h53.wsz"},
    availableSkins: [{name: "Winamp5 Classified", url: "Winamp5_Classified_v5.5_0_3h53.wsz"}],
    initialTracks: tracks,
    // EQ mac dinh TAT (fork: tat la nguon di thang ra loa), volume 100%.
    // Fork: cua so Milkdrop cao hon mac dinh (size [0,2] = 275x174) de
    // khung video 256x140 gan dung 16:9 (mac dinh 275x116 chi cho 256x82).
    __initialState: {media: {volume: 100}, equalizer: {on: false}, windows: {genWindows: {milkdrop: {size: [0, 2]}}}},
    __butterchurnOptions: {
        importButterchurn: function(){ return Promise.resolve(window.butterchurn); },
        getPresets: function(){
            try {
                var all = window.butterchurnPresets.getPresets();
                var names = Object.keys(all);
                return Promise.resolve(names.map(function(name){ return {name: name, butterchurnPresetObject: all[name]}; }));
            } catch(e){ return Promise.resolve([]); }
        },
        // Mo san cua so Milkdrop (fork hien video trong cua so nay).
        butterchurnOpen: true
    },
});
webamp.renderWhenReady(document.getElementById("app")).then(function(){
    try { webamp.setVolume(100); } catch(e){}
    try { webamp.store.dispatch({type: "SET_EQ_OFF"}); } catch(e){}
    window.webamp = webamp;
    // Giong ban Webamp truoc kia: khi tai file tren may len (nut ADD /
    // keo-tha vao playlist, link blob:), an cac kenh mac dinh tren host
    // di, chi giu file vua tai.
    try {
        webamp.store.subscribe(function(){
            try {
                var st = webamp.store.getState();
                var order = st.playlist && st.playlist.trackOrder ? st.playlist.trackOrder : [];
                if(!order.length) return;
                var media = st.tracks || st.media || {};
                var isLocal = function(id){
                    var m = media[id];
                    return m && m.url && typeof m.url === "string" && m.url.indexOf("blob:") === 0;
                };
                var localIds = order.filter(isLocal);
                if(!localIds.length) return;
                if(order.length === localIds.length) return;
                var webIds = order.filter(function(id){ return !isLocal(id); });
                if(webIds.length) webamp.store.dispatch({type: "REMOVE_TRACKS", ids: webIds});
            } catch(e){}
        });
    } catch(e){}
    // Nút full như bản Webamp trước kia: nút "–" (minimize, nút thứ 3
    // tính từ phải sang trên thanh tiêu đề cửa sổ chính) phóng to toàn
    // bộ trình phát cho vừa màn hình — điện thoại thì vừa hết màn hình,
    // PC thì vừa chiều dọc. Bản cũ scale() cả khối #webamp, có chỉnh
    // cao playlist cho vừa tỉ lệ màn hình.
    var __zoomed = false;
    var __lastZoomKey = "";
    // Chieu cao cua so: thu gon (shade) chi con thanh tieu de 14px,
    // doc truc tiep tu store (dung cho ca nut bam lan menu/phim tat).
    function __winH(id, fullH){
        try {
            var gw = webamp.store.getState().windows.genWindows[id];
            return gw && gw.shade ? 14 : fullH;
        } catch(e){ return fullH; }
    }
    // Kích thước màn hình NHÌN THẤY (trên điện thoại, visualViewport
    // trừ thanh địa chỉ trình duyệt; innerHeight thì tính cả phần bị
    // che nên scale theo nó sẽ làm trình phát to hơn màn hình).
    function __vp(){
        try {
            if(window.visualViewport){ return {w: window.visualViewport.width, h: window.visualViewport.height}; }
        } catch(e){}
        return {w: window.innerWidth, h: window.innerHeight};
    }
    function __mdH(){
        try {
            var sz = webamp.store.getState().windows.genWindows.milkdrop.size || [0, 2];
            return 116 + (sz[1] || 0) * 29;
        } catch(e){ return 174; }
    }
    function applyZoom(){
        var w = document.getElementById("webamp");
        if(!w) return;
        if(!__zoomed){
            __lastZoomKey = "";
            try {
                var orig = window.__origPlSize || [0, 0];
                webamp.store.dispatch({type:"WINDOW_SIZE_CHANGED", windowId:"playlist", size:orig});
                var xC = Math.round((__vp().w - 275) / 2);
                var mh = __winH("main", 116);
                var eh0 = __winH("equalizer", 116);
                webamp.store.dispatch({type:"UPDATE_WINDOW_POSITIONS", positions:{main:{x:xC,y:0}, equalizer:{x:xC,y:mh}, milkdrop:{x:xC,y:mh+eh0}, playlist:{x:xC,y:mh+eh0+__mdH()}}, absolute:true});
            } catch(e){}
            w.style.transform = "scale(1)";
            w.style.position = "absolute"; w.style.left = "0px"; w.style.top = "0px"; w.style.margin = "0px";
            document.body.style.height = ""; document.body.style.overflow = "";
            return;
        }
        try {
            var vp = __vp();
            var vw = vp.w, vh = vp.h;
            var scaleX = vw / 275;
            var _mainH = __winH("main", 116);
            var _eqH = __winH("equalizer", 116);
            var bestEh = 0, bestDiff = 1e9;
            for(var eh=0; eh<=40; eh++){
                var total = _mainH + _eqH + __mdH() + 116 + eh * 29;
                var sy = vh / total;
                var diff = Math.abs(sy - scaleX);
                if(diff < bestDiff){ bestDiff = diff; bestEh = eh; }
            }
            // Chi ap dung khi thong so doi (cung 1 co man hinh goi lai
            // thi bo qua) de khong bi nhay 2 lan: lan 1 vua xong, lan 2
            // (resize/thanh dia chi) goi lai cung gia tri thi khong
            // lam gi them.
            var __key = vw + "x" + vh + "x" + _mainH + "x" + _eqH + "x" + bestEh + "x" + __mdH();
            if(__key === __lastZoomKey) return;
            __lastZoomKey = __key;
            webamp.store.dispatch({type:"WINDOW_SIZE_CHANGED", windowId:"playlist", size:[0, bestEh]});
            try {
                webamp.store.dispatch({type:"UPDATE_WINDOW_POSITIONS", positions:{main:{x:0,y:0}, equalizer:{x:0,y:_mainH}, milkdrop:{x:0,y:_mainH+_eqH}, playlist:{x:0,y:_mainH+_eqH+__mdH()}}, absolute:true});
            } catch(e){}
            var totalH = _mainH + _eqH + __mdH() + 116 + bestEh * 29;
            var scaleY = vh / totalH;
            var diffRatio = scaleX ? Math.abs(scaleY - scaleX) / scaleX : 1;
            if(diffRatio <= 0.05){
                w.style.position = "absolute";
                w.style.left = "0px";
                w.style.top = "0px";
                w.style.margin = "0px";
                w.style.transformOrigin = "top left";
                w.style.transform = "scale(" + scaleX + ", " + scaleY + ")";
            } else {
                var scaleU = Math.min(scaleX, scaleY);
                var pw = 275 * scaleU;
                var ph = totalH * scaleU;
                var leftC = Math.round((vw - pw) / 2);
                var topC = Math.round((vh - ph) / 2);
                w.style.position = "absolute";
                w.style.left = leftC + "px";
                w.style.top = topC + "px";
                w.style.transformOrigin = "top left";
                w.style.transform = "scale(" + scaleU + ", " + scaleU + ")";
            }
            document.body.style.height = vh + "px";
            document.body.style.overflow = "hidden";
            document.body.style.overflowX = "hidden";
        } catch(e){}
    }
    function toggleZoom(e){
        if(e){ e.preventDefault(); e.stopPropagation(); }
        if(!__zoomed){
            try {
                var st = webamp.store.getState();
                var sz = st.windows && st.windows.genWindows && st.windows.genWindows.playlist ? st.windows.genWindows.playlist.size : [0, 0];
                window.__origPlSize = sz;
            } catch(err){}
        }
        __zoomed = !__zoomed;
        __zoomToggledAt = Date.now();
        // Chi ap dung 1 lan (ban cu goi 2 lan cach nhau 700ms, lan 2
        // tinh lai theo kich thuoc man hinh da doi -> nhay them 1 cai
        // lam to hon man hinh). Thanh dia chi hien/an lam doi kich
        // thuoc man hinh thi tinh lai qua resize ben duoi.
        setTimeout(applyZoom, 300);
    }
    // Dang full ma man hinh doi kich thuoc (thanh dia chi hien/an,
    // xoay may) thi tinh lai cho vua, khong de thua/thieu.
    var __zoomResizeT = null;
    var __zoomToggledAt = 0;
    function __onZoomResize(){
        if(!__zoomed) return;
        // Bo qua resize trong 1 giay dau sau khi bam full: thanh dia
        // chi hien/an ngay luc do lam doi co man hinh, goi lai
        // applyZoom gay ra cai nhay thu 2. Sau 1 giay (xoay may, thanh
        // dia chi doi that) thi tinh lai binh thuong.
        if(Date.now() - __zoomToggledAt < 1000) return;
        if(__zoomResizeT) clearTimeout(__zoomResizeT);
        __zoomResizeT = setTimeout(applyZoom, 200);
    }
    window.addEventListener("resize", __onZoomResize);
    try { if(window.visualViewport) window.visualViewport.addEventListener("resize", __onZoomResize); } catch(e){}
    // Thu gon/mo EQ (hoac Main) khi dang full thi playlist tu dan ra/
    // co lai cho vua man hinh: theo doi trang thai shade trong store
    // (nut thu gon tren cua so, menu, phim tat deu di qua store).
    var __lastShadeKey = "";
    try {
        webamp.store.subscribe(function(){
            if(!__zoomed) return;
            try {
                var gw = webamp.store.getState().windows.genWindows;
                var key = (gw.main && gw.main.shade ? "1" : "0") + (gw.equalizer && gw.equalizer.shade ? "1" : "0");
                if(key === __lastShadeKey) return;
                __lastShadeKey = key;
                setTimeout(applyZoom, 100);
            } catch(e){}
        });
    } catch(e){}
    function pickTitleButton(cx, cy){
        try {
            var tb = document.getElementById("title-bar");
            var mn = document.getElementById("minimize");
            var sh = document.getElementById("shade");
            if(!tb || !mn || !sh) return null;
            var tr = tb.getBoundingClientRect();
            if(cy < tr.top - 12 || cy > tr.bottom + 12) return null;
            var mr = mn.getBoundingClientRect(), sr = sh.getBoundingClientRect();
            if(cx < mr.left - 14 || cx > sr.right + 14) return null;
            var mc = mr.left + mr.width / 2, sc = sr.left + sr.width / 2;
            return Math.abs(cx - mc) <= Math.abs(cx - sc) ? "minimize" : "shade";
        } catch(e){ return null; }
    }
    document.addEventListener("click", function(e){
        var pb = pickTitleButton(e.clientX, e.clientY);
        var sh = pb ? (pb === "shade") : (e.target && e.target.closest ? !!e.target.closest("#shade") : false);
        if(pb === "minimize"){ toggleZoom(e); return; }
        if(!sh) return;
        e.preventDefault(); e.stopPropagation();
        try { webamp.store.dispatch({type:"TOGGLE_WINDOW_SHADE_MODE", windowId:"main"}); } catch(err){}
        setTimeout(function(){
            try {
                if(__zoomed){ applyZoom(); return; }
                var xC = Math.round((window.innerWidth - 275) / 2);
                var mh = __winH("main", 116);
                var eh0 = __winH("equalizer", 116);
                webamp.store.dispatch({type:"UPDATE_WINDOW_POSITIONS", positions:{main:{x:xC,y:0}, equalizer:{x:xC,y:mh}, milkdrop:{x:xC,y:mh+eh0}, playlist:{x:xC,y:mh+eh0+__mdH()}}, absolute:true});
            } catch(err2){}
        }, 200);
    }, true);
    document.addEventListener("touchend", function(e){
        try {
            var tc = e.changedTouches && e.changedTouches[0];
            if(!tc) return;
            var pb = pickTitleButton(tc.clientX, tc.clientY);
            if(pb === "minimize"){ toggleZoom(e); }
        } catch(err){}
    }, true);
});
}
loadTracks().then(startWebamp);
</script>
